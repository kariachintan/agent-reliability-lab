[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Runnable playground showing how an AI agent loop handles tool failures, unsupported claims, timeouts, session isolation, and budget limits."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
llm = ["anthropic>=0.30"]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
